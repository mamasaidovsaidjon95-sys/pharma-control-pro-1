<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123765"><title>PHARMA CONTROL PRO</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#19334d;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#123765;color:white;padding:19px 16px}header h1{font-size:21px;margin:0}header small{opacity:.8}nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:white;position:sticky;top:0;z-index:2;box-shadow:0 2px 5px #0001}button{border:0;border-radius:9px;padding:11px 13px;background:#1262a5;color:white;font-weight:650;cursor:pointer}nav button{white-space:nowrap;background:#e8f1fa;color:#17446b}nav button.active{background:#123765;color:white}main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:white;border-radius:13px;padding:17px;box-shadow:0 2px 9px #15304c12;margin-bottom:14px}.card strong{display:block;font-size:24px;margin-top:9px}.muted{color:#697c8c;font-size:13px}h2{margin:5px 0 15px;font-size:21px}h3{margin:3px 0 12px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{font-size:13px;font-weight:650}input,select{width:100%;padding:11px;border:1px solid #cbd7e1;border-radius:8px;background:white;font-size:15px;margin-top:4px}form button{align-self:end}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid #e5ebf0}th{background:#f3f7fa}.scroll{overflow:auto}.danger{background:#b52d3a}.secondary{background:#e7eef5;color:#183b5b}.notice{background:#fff3d5;border-radius:9px;padding:12px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row input,.row select{width:auto;max-width:230px}.hide{display:none}.tag{padding:3px 7px;background:#e6f3ed;border-radius:6px}.negative{color:#b52d3a}footer{text-align:center;color:#789;font-size:12px;padding:25px} @media(max-width:600px){main{padding:10px}header h1{font-size:19px}td,th{white-space:nowrap}}
</style></head><body><header><h1>💊 PHARMA CONTROL PRO</h1><small>Farmatsevtika savdosini boshqarish • Mahalliy demo</small></header><nav id="nav"></nav><main id="app"></main><footer>Ma'lumotlar hozircha faqat shu brauzerda saqlanadi. Muntazam JSON zaxira oling.</footer><script>
'use strict';const KEY='pharma-control-pro-v1';const sections=[['home','📊 Bosh sahifa'],['meds','💊 Dorilar'],['pharm','🏥 Aptekalar'],['staff','👨‍💼 Mas’ullar'],['buy','📦 Kirim'],['sell','💰 Savdo'],['pay','💳 To‘lovlar'],['report','📈 Hisobot'],['settings','⚙️ Zaxira']];let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}}for(const k of ['meds','pharm','staff','buys','sales','payments'])if(!Array.isArray(db[k]))db[k]=[];let page='home';const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('uz-UZ').format(Number(n)||0)+' so‘m',today=()=>new Date().toLocaleDateString('en-CA'),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Saqlashda xatolik: brauzer xotirasi to‘lgan bo‘lishi mumkin. JSON zaxira oling.')}}function med(i){return db.meds.find(x=>x.id===i)}function pharm(i){return db.pharm.find(x=>x.id===i)}function staff(i){return db.staff.find(x=>x.id===i)}function stock(i){return db.buys.filter(x=>x.med===i).reduce((a,x)=>a+ +x.qty,0)-db.sales.filter(x=>x.med===i).reduce((a,x)=>a+ +x.qty,0)}function debt(i){return db.sales.filter(x=>x.pharm===i).reduce((a,x)=>a+x.total,0)-db.payments.filter(x=>x.pharm===i).reduce((a,x)=>a+x.amount,0)}function opt(arr,fn){return '<option value="">Tanlang</option>'+arr.map(x=>`<option value="${safe(x.id)}">${safe(fn(x))}</option>`).join('')}function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${head.length}">Hozircha ma’lumot yo‘q</td></tr>`}</tbody></table></div>`}function f(label,name,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`}function sel(label,name,options){return `<label>${label}<select name="${name}" required>${options}</select></label>`}function form(title,fields,kind,button='Saqlash'){return `<div class="panel"><h3>${title}</h3><form data-kind="${kind}">${fields}<button>${button}</button></form></div>`}function tr(c){return '<tr>'+c.map(x=>`<td>${x}</td>`).join('')+'</tr>'}function del(kind,item){return `<button class="danger" data-del="${kind}" data-id="${safe(item.id)}">O‘chirish</button>`}function navigate(p){page=p;render();window.scrollTo(0,0)}function render(){ $('#nav').innerHTML=sections.map(([k,t])=>`<button class="${page===k?'active':''}" data-page="${k}">${t}</button>`).join('');let html='';if(page==='home'){let revenue=db.sales.reduce((a,x)=>a+x.total,0),paid=db.payments.reduce((a,x)=>a+x.amount,0),debts=db.pharm.reduce((a,x)=>a+Math.max(0,debt(x.id)),0),low=db.meds.filter(x=>stock(x.id)<= +x.min).length;html=`<h2>Boshqaruv paneli</h2><div class="grid">${[['💰 Jami savdo',money(revenue)],['💳 Jami tushum',money(paid)],['📦 Ombordagi birliklar',db.meds.reduce((a,x)=>a+stock(x.id),0)+' ta'],['🏥 Hamkor aptekalar',db.pharm.length+' ta'],['🔴 Qarzdorlik',money(debts)],['⚠️ Kam qolgan dorilar',low+' ta']].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><div class="notice">⚠️ Bu versiya bir qurilma/brauzer uchun. Haqiqiy ko‘p foydalanuvchili sinxronlash va onlayn to‘lov qabul qilish hali ulanmagan.</div><div class="panel"><h3>Ogohlantirishlar</h3>${db.meds.filter(x=>stock(x.id)<= +x.min||x.exp&&x.exp<=new Date(Date.now()+30*86400000).toISOString().slice(0,10)).map(x=>`<p>⚠️ ${safe(x.name)} — qoldiq: ${stock(x.id)}, muddat: ${safe(x.exp||'kiritilmagan')}</p>`).join('')||'Ogohlantirish yo‘q'}</div>`}
if(page==='meds'){html='<h2>Dorilar katalogi</h2>'+form('Dori qo‘shish',f('Dori nomi','name')+f('Ishlab chiqaruvchi','maker','text','')+f('Seriya','batch')+f('Yaroqlilik muddati','exp','date')+f('Olish narxi (so‘m)','cost','number','min="0" step="0.01"')+f('Sotish narxi (so‘m)','price','number','min="0" step="0.01"')+f('Minimal qoldiq','min','number','min="0" value="5"'),'meds')+'<div class="panel"><h3>Dorilar ro‘yxati</h3>'+table(['Nomi','Seriya','Muddat','Olish','Sotish','Qoldiq',''],db.meds.map(x=>tr([safe(x.name),safe(x.batch),safe(x.exp),money(x.cost),money(x.price),stock(x.id),del('meds',x)])))+'</div>'}
if(page==='pharm'){html='<h2>Hamkor aptekalar</h2>'+form('Apteka qo‘shish',f('Apteka nomi','name')+f('Manzil','address')+f('Telefon','phone','tel')+sel('Mas’ul xodim','staff',opt(db.staff,x=>x.name)),'pharm')+'<div class="panel">'+table(['Apteka','Manzil','Telefon','Mas’ul','Qarz',''],db.pharm.map(x=>tr([safe(x.name),safe(x.address),safe(x.phone),safe(staff(x.staff)?.name),money(debt(x.id)),del('pharm',x)])))+'</div>'}
if(page==='staff'){html='<h2>Mas’ul xodimlar</h2>'+form('Xodim qo‘shish',f('F.I.Sh.','name')+f('Telefon','phone','tel')+f('Lavozim','role'),'staff')+'<div class="panel">'+table(['Xodim','Telefon','Lavozim','Aptekalar',''],db.staff.map(x=>tr([safe(x.name),safe(x.phone),safe(x.role),db.pharm.filter(p=>p.staff===x.id).length,del('staff',x)])))+'</div>'}
if(page==='buy'){html='<h2>Omborga kirim</h2>'+form('Tovar kirimi',sel('Dori','med',opt(db.meds,x=>x.name+' — '+x.batch))+f('Miqdor','qty','number','min="1" step="1"')+f('Sana','date','date',`value="${today()}"`)+f('Yetkazib beruvchi','supplier'),'buys','Kirim qilish')+'<div class="panel">'+table(['Sana','Dori','Miqdor','Yetkazuvchi',''],[...db.buys].reverse().map(x=>tr([safe(x.date),safe(med(x.med)?.name),x.qty,safe(x.supplier),del('buys',x)])))+'</div>'}
if(page==='sell'){html='<h2>Savdo</h2>'+form('Yangi savdo',sel('Dori','med',opt(db.meds,x=>x.name+' (qoldiq: '+stock(x.id)+')'))+sel('Apteka','pharm',opt(db.pharm,x=>x.name))+f('Miqdor','qty','number','min="1" step="1"')+f('Bir dona sotish narxi','price','number','min="0" step="0.01"')+f('Sana','date','date',`value="${today()}"`),'sales','Savdoni qayd etish')+'<div class="panel">'+table(['Sana','Apteka','Dori','Soni','Summa',''],[...db.sales].reverse().map(x=>tr([safe(x.date),safe(pharm(x.pharm)?.name),safe(med(x.med)?.name),x.qty,money(x.total),del('sales',x)])))+'</div>'}
if(page==='pay'){html='<h2>To‘lovlar va qarzdorlik</h2>'+form('To‘lov qayd etish',sel('Apteka','pharm',opt(db.pharm,x=>x.name))+f('Summa','amount','number','min="0.01" step="0.01"')+sel('To‘lov turi','method','<option>Naqd</option><option>Bank kartasi</option><option>Bank o‘tkazmasi</option><option>QR / elektron hamyon</option><option>Aralash</option><option>Boshqa</option>')+f('Sana','date','date',`value="${today()}"`)+`<label>Izoh<input name="note" placeholder="Ixtiyoriy"></label>`,'payments','To‘lovni qayd etish')+'<div class="panel"><h3>Aptekalar balansi</h3>'+table(['Apteka','Qarzdorlik'],db.pharm.map(x=>tr([safe(x.name),`<span class="${debt(x.id)>0?'negative':''}">${money(debt(x.id))}</span>`])))+'</div><div class="panel"><h3>To‘lovlar tarixi</h3>'+table(['Sana','Apteka','Usul','Summa',''],[...db.payments].reverse().map(x=>tr([safe(x.date),safe(pharm(x.pharm)?.name),safe(x.method),money(x.amount),del('payments',x)])))+'</div>'}
if(page==='report'){let period=$('#period')?.value||'month',start=$('#start')?.value||'',end=$('#end')?.value||'',now=new Date(),begin=new Date(now);if(period==='week')begin.setDate(now.getDate()-6);if(period==='month')begin.setDate(now.getDate()-29);if(period==='year')begin.setDate(now.getDate()-364);let from=period==='custom'?start:period==='all'?'':begin.toLocaleDateString('en-CA'),to=period==='custom'?end:today(),within=x=>(!from||x.date>=from)&&(!to||x.date<=to),ss=db.sales.filter(within),pp=db.payments.filter(within),rev=ss.reduce((a,x)=>a+x.total,0),cost=ss.reduce((a,x)=>a+x.qty*(+med(x.med)?.cost||0),0);html=`<h2>Hisobotlar</h2><div class="panel row"><label>Davr<select id="period"><option value="week" ${period==='week'?'selected':''}>7 kun</option><option value="month" ${period==='month'?'selected':''}>30 kun</option><option value="year" ${period==='year'?'selected':''}>365 kun</option><option value="all" ${period==='all'?'selected':''}>Barcha vaqt</option><option value="custom" ${period==='custom'?'selected':''}>Maxsus</option></select></label><label>Boshlanish<input type="date" id="start" value="${start}"></label><label>Tugash<input type="date" id="end" value="${end}"></label><button id="applyReport">Ko‘rsatish</button></div><div class="grid">${[['Savdo',money(rev)],['Tushum',money(pp.reduce((a,x)=>a+x.amount,0))],['Taxminiy yalpi foyda',money(rev-cost)],['Savdolar soni',ss.length]].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h3>Aptekalar bo‘yicha aylanma</h3>${table(['Apteka','Savdo','To‘lov'],db.pharm.map(x=>tr([safe(x.name),money(ss.filter(s=>s.pharm===x.id).reduce((a,s)=>a+s.total,0)),money(pp.filter(p=>p.pharm===x.id).reduce((a,p)=>a+p.amount,0))])))}</div><button id="csv">Savdolarni CSV eksport qilish</button>`}
if(page==='settings'){html=`<h2>Ma’lumotlar va zaxira</h2><div class="notice">Muhim: brauzer keshini tozalash yoki boshqa telefonga o‘tish ma’lumot yo‘qolishiga olib kelishi mumkin. JSON zaxira faylini xavfsiz joyda saqlang.</div><div class="panel"><h3>Zaxiralash</h3><div class="row"><button id="export">⬇️ JSON zaxira olish</button><label class="secondary" style="padding:10px;border-radius:8px">⬆️ JSON zaxirani tiklash<input type="file" id="import" accept=".json,application/json"></label></div><p class="muted">JSON faylda barcha apteka, xodim, dori va savdo ma’lumotlari bo‘ladi. Uni begonalarga yubormang.</p></div><div class="panel"><h3>Cheklovlar</h3><p>Bu mahalliy prototip: login/rollar, server, real to‘lov integratsiyasi, audit jurnali, partiyalar bo‘yicha aniq FIFO hisob va qurilmalararo sinxronlash keyingi bosqichda yaratiladi.</p></div>`}$('#app').innerHTML=html;}
let reportFilters={period:'month',start:'',end:''};document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page);const d=e.target.closest('[data-del]');if(d){let kind=d.dataset.del,item=db[kind].find(x=>x.id===d.dataset.id);if(!item)return;if(kind==='meds'&&(db.buys.some(x=>x.med===item.id)||db.sales.some(x=>x.med===item.id))||kind==='pharm'&&(db.sales.some(x=>x.pharm===item.id)||db.payments.some(x=>x.pharm===item.id))||kind==='staff'&&db.pharm.some(x=>x.staff===item.id)){alert('Bu yozuv boshqa operatsiyalarda ishlatilgan. Avval bog‘liq yozuvlarni tekshiring.');return}if(!confirm('Yozuv o‘chirilsinmi?'))return;db[kind]=db[kind].filter(x=>x.id!==item.id);save();render()}if(e.target.id==='applyReport'){reportFilters={period:$('#period').value,start:$('#start').value,end:$('#end').value};renderReport()}if(e.target.id==='export')download('pharma-zaxira-'+today()+'.json',JSON.stringify(db,null,2),'application/json');if(e.target.id==='csv'){let csv=[['Sana','Apteka','Dori','Miqdor','Narx','Summa'],...db.sales.map(x=>[x.date,pharm(x.pharm)?.name||'',med(x.med)?.name||'',x.qty,x.price,x.total])].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');download('savdolar-'+today()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8')}});function renderReport(){let p=reportFilters;render();$('#period').value=p.period;$('#start').value=p.start;$('#end').value=p.end;let now=new Date(),begin=new Date(now);if(p.period==='week')begin.setDate(now.getDate()-6);if(p.period==='month')begin.setDate(now.getDate()-29);if(p.period==='year')begin.setDate(now.getDate()-364);let from=p.period==='custom'?p.start:p.period==='all'?'':begin.toLocaleDateString('en-CA'),to=p.period==='custom'?p.end:today(),ss=db.sales.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)),pp=db.payments.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)),rev=ss.reduce((a,x)=>a+x.total,0),cost=ss.reduce((a,x)=>a+x.qty*(+med(x.med)?.cost||0),0);let cards=$('#app .grid');cards.innerHTML=[['Savdo',money(rev)],['Tushum',money(pp.reduce((a,x)=>a+x.amount,0))],['Taxminiy yalpi foyda',money(rev-cost)],['Savdolar soni',ss.length]].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('');$('#app .panel:last-of-type').innerHTML='<h3>Aptekalar bo‘yicha aylanma</h3>'+table(['Apteka','Savdo','To‘lov'],db.pharm.map(x=>tr([safe(x.name),money(ss.filter(s=>s.pharm===x.id).reduce((a,s)=>a+s.total,0)),money(pp.filter(s=>s.pharm===x.id).reduce((a,s)=>a+s.amount,0))])))}document.addEventListener('submit',e=>{const form=e.target.closest('form[data-kind]');if(!form)return;e.preventDefault();let kind=form.dataset.kind,o=Object.fromEntries(new FormData(form));o.id=id();if(kind==='meds'){o.cost=+o.cost;o.price=+o.price;o.min=+o.min;if(db.meds.some(x=>x.name.toLowerCase()===o.name.toLowerCase()&&x.batch===o.batch)){alert('Bunday dori va seriya allaqachon mavjud');return}}if(kind==='buys'){o.qty=+o.qty;if(!med(o.med)){alert('Avval dori qo‘shing');return}}if(kind==='sales'){o.qty=+o.qty;o.price=+o.price;if(!med(o.med)||!pharm(o.pharm)){alert('Avval dori va apteka qo‘shing');return}if(stock(o.med)<o.qty){alert('Omborda yetarli dori yo‘q. Qoldiq: '+stock(o.med));return}o.total=o.qty*o.price}if(kind==='payments'){o.amount=+o.amount;if(!pharm(o.pharm)){alert('Avval apteka qo‘shing');return}}if(kind==='pharm'&&!staff(o.staff)){alert('Avval mas’ul xodim qo‘shing');return}db[kind].push(o);save();render();alert('Muvaffaqiyatli saqlandi')});function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.addEventListener('change',async e=>{if(e.target.id!=='import')return;try{let obj=JSON.parse(await e.target.files[0].text());if(!['meds','pharm','staff','buys','sales','payments'].every(k=>Array.isArray(obj[k])))throw Error('Noto‘g‘ri zaxira tuzilishi');if(!confirm('Diqqat! Hozirgi barcha ma’lumotlar zaxiradagi ma’lumotlar bilan ALMASHTIRILADI. Davom etasizmi?'))return;db=obj;save();render();alert('Zaxira tiklandi')}catch(err){alert('Faylni o‘qib bo‘lmadi: '+err.message)}});render();
</script></body></html>
